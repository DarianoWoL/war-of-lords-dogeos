<!DOCTYPE html>
<html lang="en" data-source-lang="en" data-source-lang="en" translate="no">
<head>
    <script src="/doge-theme.js"></script>
    <style>body{visibility:hidden;}</style>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>War of Lords - Global Ranking</title>
    <style>
        body { 
            /* Wczytanie wspólnego tła */
            background-image: url('/assets/background.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #0f172a; /* Kolor awaryjny */
            
            color: #f8fafc; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-bottom: 24px;
        }
        
        .nav-menu { background: url('/pasek gorny bez ikon.png') 113.64px top / 1883.07px auto no-repeat; width: 100%; padding: 15px 0; text-align: center; margin-bottom: 15px; }
        .nav-menu a { color: #94a3b8; text-decoration: none; margin: 0 20px; font-weight: bold; font-size: 16px; }
        .nav-menu a:hover, .nav-menu a.active { color: #e8c766; }

        /* Baked-in default nav link layout, adopted site-wide from a player-arranged position
           (see layout-editor.js) so every visitor sees the same arrangement by default. */
        .nav-menu { position: relative; width: 1998px; max-width: 100%; height: 138px; }
        #navHome { position: absolute; left: 461.30px; top: 46.11px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }
        #navRooms { display: none !important; position: absolute; left: 567.31px; top: 46.78px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }
        #navTournaments { position: absolute; left: 703.09px; top: 46.78px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }
        #navShop { position: absolute; left: 811.31px; top: 47.89px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }
        #navRanking { position: absolute; left: 1068.75px; top: 47.89px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }
        #navProfile { position: absolute; left: 1207.29px; top: 46.78px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }
        #navRules { position: absolute; left: 1306.08px; top: 45.67px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }

        h1 { color: #e8c766; margin-bottom: 4px; margin-top: 8px; text-shadow: 0px 4px 8px rgba(0,0,0,0.8); text-transform: uppercase; letter-spacing: 0.04em; }
        .subtitle { color: #cbd5e1; margin-bottom: 14px; text-align: center; text-shadow: 0px 2px 4px rgba(0,0,0,0.8); font-weight: 500; }

        /* Kontener tabeli - to samo tło co na ekranie końca rundy (round-result-card w game.html),
           z tym samym ciemnym gradientem dla czytelności tekstu nad jasnym obrazkiem. */
        .leaderboard-container {
            background: linear-gradient(180deg, rgba(10, 16, 33, 0.55), rgba(8, 12, 26, 0.78)), url('/tlokoniec.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            max-width: 800px;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            box-shadow: inset 0 0 0 1px rgba(240, 215, 140, 0.1), 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        /* Wysokość dobrana tak, by cała strona (nav + nagłówek + wyszukiwarka + ta tabela) mieściła
           się w oknie przeglądarki bez przewijania jej samej — przewija się tylko lista graczy w
           środku, nagłówek kolumn (thead) zostaje przypięty na górze dzięki position:sticky. */
        .leaderboard-scroll { height: 560px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: #e8c766; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; padding: 15px; border-bottom: 2px solid rgba(212, 175, 55, 0.3); position: sticky; top: 0; background: rgba(10, 16, 33, 0.92); z-index: 1; }
        td { padding: 15px; border-bottom: 1px solid rgba(212, 175, 55, 0.12); font-size: 16px; color: #e2e8f0; transition: background-color 0.2s; }

        tr:hover td { background-color: rgba(212, 175, 55, 0.08); color: #ffffff; }

        .rank-1 { color: #fbbf24; font-weight: bold; }
        .rank-2 { color: #cbd5e1; font-weight: bold; }
        .rank-3 { color: #b45309; font-weight: bold; }

        /* Wyróżnienie rzędu gracza z neonowym efektem borderu */
        .my-row td { background-color: rgba(212, 175, 55, 0.15) !important; color: #ffffff !important; font-weight: 500; }
        .my-row:hover td { background-color: rgba(212, 175, 55, 0.25) !important; }

        .badge { background-color: #0f172a; padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(212, 175, 55, 0.35); font-weight: bold; display: inline-block; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
    </style>
    <script src="/locales.js"></script>
    <script src="/texts/ranking.js"></script>
    <script src="/i18n.js"></script>
</head>
<body>
    <div class="nav-menu layout-editor-ignore">
        <a id="navHome" href="index.html">Home</a>
        <a id="navRooms" href="pokoje.html">Battle Rooms</a>
        <a id="navTournaments" href="turnieje.html">Tournaments</a>
        <a id="navShop" href="live.html">Live Bets</a>
        <a id="navRanking" href="ranking.html" class="active">Overall Ranking</a>
        <a id="navProfile" href="profile.html">Profile</a>
        <a id="navRules" href="zasady.html">Rules</a>
    </div>
    
    <h1>Hall of Fame</h1>
    <p class="subtitle">The best commanders ranked by MMR points</p>

    <input type="text" id="rankingSearchInput" placeholder="Search for a player by name..." oninput="filterRanking()" style="max-width: 800px; width: 100%; padding: 12px 16px; margin-bottom: 12px; border-radius: 10px; border: 1px solid rgba(212, 175, 55, 0.35); background: rgba(15, 23, 42, 0.9); color: #f8fafc; font-size: 15px; box-sizing: border-box;" />

    <div class="leaderboard-container">
        <div class="leaderboard-scroll">
            <table>
                <thead><tr><th>Place</th><th>Commander</th><th>Matches</th><th>Wins</th><th>MMR</th></tr></thead>
                <tbody id="leaderboard-body"><tr><td colspan="5" style="text-align: center; color: #64748b;">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        let fullRanking = [];

        function renderRankingRows(ranking) {
            const mojNick = localStorage.getItem('username') || localStorage.getItem('warlordNick');
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';
            if (!ranking.length) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #64748b;">No players match your search.</td></tr>';
                return;
            }
            ranking.forEach((gracz) => {
                const wiersz = document.createElement('tr');
                if (gracz.nick === mojNick) wiersz.className = 'my-row';
                let pos = gracz.rank;
                if (pos === 1) pos = `<span class="rank-1">🥇 1</span>`;
                else if (pos === 2) pos = `<span class="rank-2">🥈 2</span>`;
                else if (pos === 3) pos = `<span class="rank-3">🥉 3</span>`;
                wiersz.innerHTML = `<td>${pos}</td><td>${gracz.nick} ${gracz.nick === mojNick ? '<span style="color:#e8c766;font-size:12px;margin-left:5px;">(Ty)</span>' : ''}</td><td>${gracz.sumaGier ?? 0}</td><td>${gracz.wygrane ?? 0}</td><td><span class="badge" style="color:#fbbf24;">${gracz.mmr}</span></td>`;
                tbody.appendChild(wiersz);
            });
        }

        function filterRanking() {
            const query = document.getElementById('rankingSearchInput').value.trim().toLowerCase();
            const filtered = query
                ? fullRanking.filter((gracz) => (gracz.nick || '').toLowerCase().includes(query))
                : fullRanking;
            renderRankingRows(filtered);
        }

        async function loadRanking() {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #64748b;">Loading...</td></tr>';
            try {
                const response = await fetch('/api/ranking');
                if (!response.ok) throw new Error('Could not load the ranking');
                fullRanking = await response.json();
                filterRanking();
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #f87171;">${error.message}</td></tr>`;
            }
        }

        loadRanking();
    </script>
    <script src="/cookie-consent.js"></script>
    <script src="/site-footer.js"></script>
    <script src="/page-scale.js"></script>
    <script src="/wol-guest.js"></script>
    <script src="/wol-connect.js"></script>
</body>
</html>
