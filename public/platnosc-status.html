<!DOCTYPE html>
<html lang="en" data-source-lang="en" data-source-lang="en" data-source-lang="en" translate="no">
<head>
    <script src="/doge-theme.js"></script>
    <style>body{visibility:hidden;}</style>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>War of Lords - Payment status</title>
    <style>
        body {
            background-image: url('/assets/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 60px;
        }

        .nav-menu { background: url('/pasek gorny bez ikon.png') 113.64px top / 1883.07px auto no-repeat; width: 100%; padding: 15px 0; text-align: center; margin-bottom: 40px; }
        .nav-menu a { color: #94a3b8; text-decoration: none; margin: 0 20px; font-weight: bold; font-size: 16px; }
        .nav-menu a:hover, .nav-menu a.active { color: #e8c766; }
        .nav-menu { position: relative; width: 1998px; max-width: 100%; height: 138px; }
        #navHome { position: absolute; left: 461.30px; top: 46.11px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }
        #navRooms { display: none !important; position: absolute; left: 567.31px; top: 46.78px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }
        #navTournaments { position: absolute; left: 703.09px; top: 46.78px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }
        #navShop { position: absolute; left: 811.31px; top: 47.89px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }
        #navRanking { position: absolute; left: 1068.75px; top: 47.89px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }
        #navProfile { position: absolute; left: 1207.29px; top: 46.78px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }
        #navRules { position: absolute; left: 1306.08px; top: 45.67px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }

        .status-card {
            width: 100%;
            max-width: 520px;
            background: linear-gradient(180deg, rgba(18, 27, 48, 0.95), rgba(10, 16, 33, 0.96));
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 20px;
            padding: 40px 36px;
            box-sizing: border-box;
            box-shadow: inset 0 0 0 1px rgba(240, 215, 140, 0.1), 0 16px 45px rgba(0,0,0,0.4);
            margin: 0 20px;
            text-align: center;
        }

        .status-icon { font-size: 52px; margin-bottom: 14px; }
        .status-title { font-size: 22px; font-weight: bold; color: #e8c766; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 12px; }
        .status-desc { color: #cbd5e1; font-size: 15px; line-height: 1.6; margin-bottom: 26px; }
        .status-title.success { color: #34d399; }
        .status-title.failed { color: #f87171; }

        .status-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .status-btn {
            background-image: url('/przycisk.png');
            background-size: 100% 100%; background-color: transparent;
            color: #e8c766; border: none; padding: 12px 24px; font-size: 14px; font-weight: bold;
            border-radius: 0; cursor: pointer; text-decoration: none; display: inline-block;
        }
        .status-btn:hover { color: #f0d78c; }
    </style>
    <script src="/locales.js"></script>
    <script src="/texts/platnosc-status.js"></script>
    <script src="/i18n.js"></script>
</head>
<body>
    <div class="nav-menu layout-editor-ignore">
        <a id="navHome" href="index.html">Home</a>
        <a id="navRooms" href="pokoje.html">Battle Rooms</a>
        <a id="navTournaments" href="turnieje.html">Tournaments</a>
        <a id="navShop" href="live.html" class="active">Live Bets</a>
        <a id="navRanking" href="ranking.html">Overall Ranking</a>
        <a id="navProfile" href="profile.html">Profile</a>
        <a id="navRules" href="zasady.html">Rules</a>
    </div>

    <div class="status-card" id="statusCard">
        <div class="status-icon">⏳</div>
        <div class="status-title" id="statusTitle">Checking the payment status...</div>
        <div class="status-desc" id="statusDesc">This may take a few seconds. Do not close this page.</div>
        <div class="status-actions" id="statusActions" style="display:none;"></div>
    </div>

    <script>
        const token = localStorage.getItem('authToken') || localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login.html';
        }
        const headers = { Authorization: `Bearer ${token}` };

        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('order');
        const negativeReturn = params.get('result') === 'negative';
        const isMiniTicket = params.get('type') === 'mini';

        function renderStatus(title, desc, icon, cls, actionsHtml) {
            document.querySelector('.status-icon').textContent = icon;
            const titleEl = document.getElementById('statusTitle');
            titleEl.textContent = title;
            titleEl.className = 'status-title' + (cls ? ' ' + cls : '');
            document.getElementById('statusDesc').textContent = desc;
            const actions = document.getElementById('statusActions');
            actions.style.display = 'flex';
            actions.innerHTML = actionsHtml || `
                <a href="sklep-bilety.html" class="status-btn">Back to the shop</a>
                <a href="profile.html" class="status-btn">My profile</a>
            `;
        }

        async function pollStatus(attemptsLeft) {
            if (!orderId) {
                renderStatus('No order information', 'No order ID was found in the page address.', '⚠️', 'failed');
                return;
            }
            try {
                const statusUrl = isMiniTicket ? `/api/payments/mini-tickets/${orderId}/status` : `/api/payments/tickets/${orderId}/status`;
                const response = await fetch(statusUrl, { headers });
                if (!response.ok) throw new Error('status check failed');
                const data = await response.json();
                if (data.status === 'paid') {
                    if (isMiniTicket) {
                        renderStatus(
                            'Payment successful!',
                            'The Mini-Tournament Ticket has been added to your account. You can now join any Mini-Tournament that requires a ticket.',
                            '✅', 'success',
                            `
                                <a href="/mini-tournaments" class="status-btn">See Mini-Tournaments</a>
                                <a href="profile.html" class="status-btn">My profile</a>
                            `
                        );
                    } else {
                        renderStatus(
                            'Payment successful!',
                            `Added ${data.quantity} ${data.quantity === 1 ? 'tournament ticket' : 'tournament tickets'} to your account. You have been registered for the tournament automatically.`,
                            '✅', 'success',
                            `
                                <a href="/tournaments" class="status-btn">Enter the tournament</a>
                                <a href="profile.html" class="status-btn">My profile</a>
                            `
                        );
                    }
                    try { localStorage.setItem('lastProfileRefresh', String(Date.now())); } catch (e) {}
                    return;
                }
                if (data.status === 'failed') {
                    renderStatus(
                        'Payment failed',
                        'The transaction was rejected or cancelled. No tickets were added — try again in the shop.',
                        '❌', 'failed'
                    );
                    return;
                }
                // still pending — keep polling for a while, HotPay's own confirmation can take
                // a few seconds to land even after the browser redirect back here.
                if (attemptsLeft <= 0) {
                    renderStatus(
                        'Payment in progress',
                        'The confirmation is taking longer than usual. Check your tickets in your Profile in a moment — if nothing changes after a few minutes, contact us: support@waroflords.pl.',
                        '⏳'
                    );
                    return;
                }
                setTimeout(() => pollStatus(attemptsLeft - 1), 2500);
            } catch (err) {
                renderStatus('Status check error', 'Could not check the payment status. Refresh the page or check your Profile in a moment.', '⚠️', 'failed');
            }
        }

        if (negativeReturn) {
            renderStatus('Payment cancelled', 'The transaction was cancelled or rejected. No tickets were added.', '❌', 'failed');
        } else {
            pollStatus(20);
        }
    </script>
    <script src="/cookie-consent.js"></script>
    <script src="/site-footer.js"></script>
    <script src="/page-scale.js"></script>
</body>
</html>
