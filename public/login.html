<!DOCTYPE html>
<html lang="en" data-source-lang="en" data-source-lang="en" translate="no">
<head>
    <script src="/doge-theme.js"></script>
    <style>body{visibility:hidden;}</style>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="auth.pageTitle">War of Lords - Log in</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Same background as every other page (index.html etc.) — painted on <html>, not <body>,
           because page-scale.js applies a CSS transform to body (to fit the 1998px design canvas
           into the real window), and a transformed element's own box becomes the sizing reference
           for "fixed" backgrounds instead of the viewport. <html> is never transformed. */
        html {
            background-image: url('/assets/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #0f172a;
        }

        body {
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .nav-menu {
            background: url('/pasek gorny bez ikon.png') 113.64px top / 1883.07px auto no-repeat;
            width: 100%;
            padding: 15px 0;
            text-align: center;
        }

        .nav-menu a {
            color: #94a3b8;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
            font-size: 16px;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            color: #d4af37;
        }

        /* Baked-in default nav link layout, adopted site-wide from a player-arranged position
           (see layout-editor.js) so every visitor sees the same arrangement by default. */
        .nav-menu { position: relative; width: 1998px; max-width: 100%; height: 138px; }
        #navHome { position: absolute; left: 461.30px; top: 46.11px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }
        #navRooms { display: none !important; position: absolute; left: 567.31px; top: 46.78px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }
        #navTournaments { position: absolute; left: 703.09px; top: 46.78px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }
        #navShop { position: absolute; left: 811.31px; top: 47.89px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }
        #navRanking { position: absolute; left: 1068.75px; top: 47.89px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }
        #navProfile { position: absolute; left: 1207.29px; top: 46.78px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }
        #navRules { position: absolute; left: 1306.08px; top: 45.67px; width: 160px; height: 60px; margin: 0; box-sizing: border-box; }

        .page-content {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-container {
            background-color: rgba(20, 25, 35, 0.9);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0px 8px 32px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(212, 175, 55, 0.1);
            backdrop-filter: blur(10px);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            color: #d4af37;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .logo p {
            color: #7f6e4b;
            font-size: 12px;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #d4af37;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            background-color: #0f1419;
            border: 1px solid #3d4b5c;
            border-radius: 5px;
            color: #e8eef5;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
            background-color: #121820;
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin: 20px 0;
            font-size: 14px;
        }

        .remember-me input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
            accent-color: #d4af37;
        }

        .remember-me label {
            margin: 0;
            color: #7f6e4b;
            cursor: pointer;
            text-transform: none;
            letter-spacing: 0;
        }

        .consent-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 16px 0;
            text-align: left;
        }

        .consent-row input[type="checkbox"] {
            margin-top: 3px;
            cursor: pointer;
            accent-color: #d4af37;
            flex-shrink: 0;
        }

        .consent-row label {
            margin: 0;
            color: #7f6e4b;
            cursor: pointer;
            text-transform: none;
            letter-spacing: 0;
            font-size: 13px;
            line-height: 1.5;
        }

        .consent-row label a {
            color: #d4af37;
            font-weight: 600;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-image: url('/przycisk.png');
            background-size: 100% 100%; background-color: transparent;
            border: none;
            border-radius: 0;
            color: #d4af37;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .login-btn:hover {
            color: #f0d78c;
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 13px;
        }

        .links a {
            color: #7f6e4b;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .links a:hover {
            color: #d4af37;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        .register-link p {
            color: #7f6e4b;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .register-link a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .register-link a:hover {
            color: #d4b066;
            text-decoration: underline;
        }

        .error-message {
            background-color: rgba(220, 53, 69, 0.2);
            border-left: 3px solid #dc3545;
            color: #ff7f7f;
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }

        .success-message {
            background-color: rgba(40, 167, 69, 0.2);
            border-left: 3px solid #28a745;
            color: #7fff7f;
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            .logo h1 {
                font-size: 24px;
            }

            .links {
                flex-direction: column;
                gap: 10px;
            }

            .links a {
                display: block;
                text-align: center;
            }
        }
    </style>
    <script src="/locales.js"></script>
    <script src="/i18n.js"></script>
</head>
<body>
    <div class="nav-menu layout-editor-ignore">
        <a id="navHome" href="index.html">Home</a>
        <a id="navRooms" href="pokoje.html">Battle Rooms</a>
        <a id="navTournaments" href="turnieje.html">Tournaments</a>
        <a id="navShop" href="live.html">Live Bets</a>
        <a id="navRanking" href="ranking.html">Overall Ranking</a>
        <a id="navProfile" href="login.html" class="active">Profile</a>
        <a id="navRules" href="zasady.html">Rules</a>
    </div>

    <div class="page-content">
    <div class="login-container">
        <div class="logo">
            <h1>⚔ War of Lords</h1>
            <p>Connect your wallet to play</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div id="walletLogin" style="text-align:center;">
            <button type="button" id="connectWalletBtn" style="width:100%; padding:16px; font-size:19px; font-weight:800; background:linear-gradient(#e8c766,#b8932f); color:#1a1405; border:0; border-radius:8px; cursor:pointer;">Connect wallet</button>
            <div style="margin-top:10px; font-size:13px; color:#94a3b8;">Sign in with X, e-mail or your DogeOS wallet. No password, no registration. DogeOS testnet &mdash; test DOGE only.</div>
            <div style="margin-top:8px; font-size:12px; color:#94a3b8;">By connecting you accept the <a href="regulamin.html" style="color:#e8c766;">Terms</a> and the <a href="polityka-prywatnosci.html" style="color:#e8c766;">Privacy Policy</a>.</div>
        </div>

        <div class="links" style="justify-content:center; margin-top:18px;">
            <a href="index.html">Home page</a>
        </div>
    </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function () {
            if (localStorage.getItem('authToken') || localStorage.getItem('token')) window.location.href = '/index.html';
        });
        function showError(message) {
            var el = document.getElementById('errorMessage');
            el.textContent = message; el.style.display = 'block';
            setTimeout(function () { el.style.display = 'none'; }, 6000);
        }
        function showSuccess(message) {
            var el = document.getElementById('successMessage');
            el.textContent = message; el.style.display = 'block';
        }
    </script>
    <script src="/wol-connect.js"></script>
    <script>
        (function () {
            var box = document.getElementById('walletLogin'), btn = document.getElementById('connectWalletBtn');
            WolConnect.config().then(function (c) { if (!c.enabled) { btn.disabled = true; btn.textContent = 'Wallet login unavailable'; } }).catch(function () { btn.disabled = true; btn.textContent = 'Wallet login unavailable'; });
            btn.addEventListener('click', function () {
                btn.disabled = true; btn.textContent = 'Connecting…';
                WolConnect.loginWithWallet().then(function (res) {
                    return (res.needsUsername ? WolConnect.promptUsername() : Promise.resolve(res.username)).then(function (name) {
                        showSuccess('Welcome, ' + name + '!');
                        setTimeout(function () { window.location.href = '/index.html'; }, 600);
                    });
                }).catch(function (e) {
                    btn.disabled = false; btn.textContent = 'Connect wallet';
                    showError((e && (e.shortMessage || e.message)) || 'Could not connect the wallet.');
                });
            });
        })();
    </script>
    <script src="/cookie-consent.js"></script>
    <script src="/site-footer.js"></script>
    <script src="/page-scale.js"></script>
</body>
</html>
