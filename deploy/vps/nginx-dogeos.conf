# Osobny wpis dla wersji demo: dogeos.waroflords.pl -> localhost:3300 (produkcyjny waroflords.pl nie jest ruszany).
# Certbot dopisze sekcje HTTPS (listen 443 ssl) po uruchomieniu setup-nginx.sh.
server {
    listen 80;
    server_name dogeos.waroflords.pl;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
