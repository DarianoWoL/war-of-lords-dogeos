version: '3.8'
services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - 27017:27017

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/strategic_game
      - JWT_SECRET=very_change_this
      - ADMIN_PASSWORD=Najemnik412
    ports:
      - 3000:3000
    volumes:
      - ./:/app
      - /app/node_modules

volumes:
  mongo-data:
